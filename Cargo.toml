[package]
name = "rupunct"
version = "0.16.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "On-device Russian punctuation and casing restoration. One binary. No cloud."
repository = "https://github.com/ekhodzitsky/rupunct-rs"
authors = ["Evgeny Khodzitsky"]
readme = "README.md"
keywords = ["punctuation", "russian", "bert", "nlp", "asr"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rupunct"
path = "src/main.rs"

[dependencies]
serde_json = "1"
memmap2 = "0.9"

[target.'cfg(not(target_os = "macos"))'.dependencies]
gemm = "0.19"

[dev-dependencies]
tempfile = "3"
