name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --lib --bins
      - name: coverage
        run: cargo llvm-cov --lib --bins --fail-under-lines 90
      - name: file-size
        run: python3 scripts/check-file-size.py
      - name: changelog
        run: python3 scripts/check-changelog.py
